# 用法:
#   cp .env.example .env   # 填 ADMIN_PASSWORD
#   docker compose up -d --build
#
# 服务组成:
#   app    网关本体(MCP /mcp + 控制台 / + 管理 API),数据在命名卷 app-data。
#          仅发布到宿主机回环地址,由宿主机 Nginx 终止 TLS 并反向代理。

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

volumes:
  app-data:
